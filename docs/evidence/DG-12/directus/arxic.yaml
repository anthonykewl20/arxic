# DG-12 exit-campaign config template — directus (TS/JS).
#
# The runner (packages/intent-proposal-spike/scripts/dg11-run-validation.ts)
# rewrites these placeholders into a TEMP copy before every run:
#   http://127.0.0.1:DG11-PROXY-PORT  -> the live attestation-front proxy origin
#   DG11-CLONE-PATH                   -> ARXIC_DG11_TARGET_REPO (pristine clone)
#   DG11-CLONE-COMMIT                 -> the ratified pin (decision 3)
# This file is never consumed as-is. The runner rewrites ONLY those three
# placeholders (dg11-run-validation.ts:1196-1200) — no credential ever passes
# through this template; the persona credential is env-only
# (ARXIC_INPUT_PERSONA_EMAIL / ARXIC_INPUT_PERSONA_PASSWORD, set by the
# launcher at run time; apps/cli/src/local-executor.ts:353-359).
#
# Diff vs the DG-11 template (docs/evidence/DG-11/directus/arxic.yaml), per
# docs/evidence/DG-12/DESIGN.md:
#   - fixtures.personaProvisioner names the campaign's fixture strategy
#     (boot-seeded registered-user admin). Provider-name string only — the
#     validator accepts optional strings (apps/cli/src/config/validate.ts:138-145)
#     and NEITHER executor lane reads it for provisioning; it documents intent.
version: 1
source:
  repository: DG11-CLONE-PATH
  revision: DG11-CLONE-COMMIT
  languages: [typescript, javascript]
scope:
  # Non-empty is REQUIRED by config validation (apps/cli/src/config/validate.ts:53).
  # express is truthful for directus (express-based API) and its installed
  # rulepack range (>=4 <6, rulepacks/express/pack.json) covers the pin.
  domains: [authentication]
  frameworks: [express]
  browsers: [chromium]
  personas: [anonymous, registered-user]
target:
  origin: http://127.0.0.1:DG11-PROXY-PORT
  environmentClass: local-test
  attestationPath: /.well-known/arxic-test-target.json
  allowedOrigins:
    - http://127.0.0.1:DG11-PROXY-PORT
policy:
  maxUrls: 8
  maxDepth: 1
  maxRuntimeMinutes: 30
  mutation: leased-fixtures-only
  externalNetwork: deny
  requiredVerificationRuns: 2
  screenshots: transition-checkpoints
  trace: retain
  humanApproval: [destructive, external-side-effect]
fixtures:
  personaProvisioner: boot-seeded-admin
  replayPersona:
    mode: per-pass-login
    login:
      route: /admin/login
      fields:
        - { label: Email, inputRef: persona.email }
        - { label: Password, inputRef: persona.password }
      submit: { label: Sign In }
models:
  # models.provider doubles as the MODEL ID the pipeline sends upstream
  # (apps/cli/src/local-executor.ts:336-345, name: provider).
  # 2026-08-20 decision-2 amendment 2 (#255): openai/gpt-4o-mini via the opencode-connected OpenRouter account (zai coding-plan surface proven protocol-incompatible — see #255 FINDINGS).
  provider: openai/gpt-4o-mini
  sourceRetention: disabled
