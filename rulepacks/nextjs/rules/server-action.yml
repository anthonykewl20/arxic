id: nextjs-server-action
language: TypeScript
message: Exported async server action candidate
severity: info
rule:
  any:
    - pattern: export async function $NAME($$$ARGS) { $$$BODY }
    - pattern: 'export async function $NAME($$$ARGS): $RETURN { $$$BODY }'
metadata:
  arxic:
    category: handler
    semver: 1.0.0
    frameworkVersions: '>=15 <16'
    precision: Applied in use-server action modules and captures exported handler name
    fallback: Bound or composed actions need runtime reconciliation
    license: MIT
    provenance: original-arxic
