id: nextjs-password-hash
language: TypeScript
message: bcrypt password operation
severity: info
rule:
  any:
    - pattern: bcrypt.compare($PASSWORD, $HASH)
    - pattern: bcrypt.hash($PASSWORD, $COST)
metadata:
  arxic:
    category: password-hash
    semver: 1.0.0
    frameworkVersions: '>=15 <16'
    precision: Direct bcrypt compare or hash with captured operands
    fallback: Wrapped password providers are not inferred
    license: MIT
    provenance: original-arxic
