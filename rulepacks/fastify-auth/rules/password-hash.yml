id: fastify-password-hash
language: TypeScript
message: password hashing or verification
severity: info
rule:
  any:
    - pattern: scryptSync($PASSWORD, $SALT, $KEYLEN)
    - pattern: timingSafeEqual($SUPPLIED, $EXPECTED)
    - pattern: bcrypt.compare($PASSWORD, $HASH)
    - pattern: bcrypt.hash($PASSWORD, $COST)
metadata:
  arxic:
    category: password-hash
    semver: 1.0.0
    frameworkVersions: '>=4 <6'
    precision: Direct scrypt, timing-safe compare or bcrypt operands
    fallback: Wrapped password providers are not inferred
    license: MIT
    provenance: original-arxic
