id: fastify-jwt-verify
language: TypeScript
message: Fastify JWT verification
severity: info
rule:
  any:
    - pattern: $REQUEST.jwtVerify($$$ARGS)
    - pattern: app.jwt.verify($$$ARGS)
metadata:
  arxic:
    category: token-verify
    semver: 1.0.0
    frameworkVersions: '>=4 <6'
    precision: Captures the @fastify/jwt request decorator and instance verify calls
    fallback: Manual header decoding requires another rule
    license: MIT
    provenance: original-arxic
