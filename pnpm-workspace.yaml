packages:
  - 'apps/*'
  - 'packages/*'
  - 'test-fixtures/*'
allowBuilds:
  '@ast-grep/cli': true
  better-sqlite3: true
  cpu-features: true
  esbuild: true
  protobufjs: true
  sharp: true
  ssh2: true
  tree-sitter: true
  tree-sitter-javascript: true
  tree-sitter-php: true
  tree-sitter-typescript: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@langchain/core@1.2.4'
  - '@langchain/langgraph@1.4.9'
  - '@crawlee/basic@3.18.0'
  - '@crawlee/browser-pool@3.18.0'
  - '@crawlee/browser@3.18.0'
  - '@crawlee/cheerio@3.18.0'
  - '@crawlee/cli@3.18.0'
  - '@crawlee/core@3.18.0'
  - '@crawlee/http@3.18.0'
  - '@crawlee/jsdom@3.18.0'
  - '@crawlee/linkedom@3.18.0'
  - '@crawlee/memory-storage@3.18.0'
  - '@crawlee/playwright@3.18.0'
  - '@crawlee/puppeteer@3.18.0'
  - '@crawlee/templates@3.18.0'
  - '@crawlee/types@3.18.0'
  - '@crawlee/utils@3.18.0'
  - crawlee@3.18.0
patchedDependencies:
  stream-json@1.9.1: patches/stream-json@1.9.1.patch
  yazl@3.3.1: patches/yazl@3.3.1.patch
overrides:
  esbuild: 0.28.1
  # Security floors for vulnerable transitives (issue #371; dependabot alerts
  # #217/#218/#221/#222 fast-uri <3.1.6 via ajv, #219/#220 qs <6.16.0 via
  # express/body-parser). fast-uri stays on 3.x — ajv 8.x declares ^3.
  fast-uri: ^3.1.6
  qs: ^6.16.0
