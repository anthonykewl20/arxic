name: Bug report
description: Report a bug or behavior mismatch.
title: 'bug: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For slice work, use the milestone slice issue path and avoid opening an
        unrelated bug for tracked implementation slices.

        ## Mandatory issue workflow

        1. Work on an issue starts by adding the `in-progress` label and a
           comment so agents and humans can see it is taken.
        2. Create worktrees inside the project at `.worktrees/<branch-or-slice-id>`;
           remove each worktree after merge or abandonment so the workspace stays clean.
        3. Define clear, zero-ambiguity acceptance criteria requiring real-world,
           real-live-data validation and proof.
        4. Post real issue comments for every meaningful change; never bury history
           or information.
        5. Close issues only with real proof and validation; do not leave completed
           work open.
        6. If work stops mid-flight, post an update and hand-off comment so the next
           agent can continue.
        7. Update all documentation, including `README` and every Markdown file, so
           no documentation is stale before the issue is closed.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Clear summary of observed behavior.
      placeholder: Describe the unexpected result.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
      placeholder: Describe expected output and evidence outcome.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal reproducible steps.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Arxic version
      description: Current version from VERSION file
      placeholder: 0.0.0
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, node version, pnpm version, and other relevant context.
      placeholder: Linux, Node 24, pnpm 11
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      description: Include relevant logs or command output. Never attach a raw Playwright trace; attach only an independently inspected sanitized action timeline with its adjacent sidecar.
      render: shell
