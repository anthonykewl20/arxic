name: Bug report
description: Report a bug or behavior mismatch.
title: 'bug: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For slice work, use the milestone slice issue path and avoid opening an
        unrelated bug for tracked implementation slices.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Clear summary of observed behavior.
      placeholder: Describe the unexpected result.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
      placeholder: Describe expected output and evidence outcome.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal reproducible steps.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Arxic version
      description: Current version from VERSION file
      placeholder: 0.0.0
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, node version, pnpm version, and other relevant context.
      placeholder: Linux, Node 24, pnpm 11
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      description: Include relevant logs or command output. Never attach a raw Playwright trace; attach only an independently inspected sanitized action timeline with its adjacent sidecar.
      render: shell
