name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Verify release metadata (tag == VERSION == package.json)
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(cat VERSION)"
          PKG="$(node -p 'require("./package.json").version')"
          echo "tag=$TAG version=$VERSION package.json=$PKG"
          if [ "$VERSION" = "0.0.0" ]; then
            echo "::error::VERSION is 0.0.0 (no release cut yet); refusing to publish."
            exit 1
          fi
          if [ "$TAG" != "$VERSION" ] || [ "$TAG" != "$PKG" ] || [ "$VERSION" != "$PKG" ]; then
            echo "::error::Version mismatch: tag=$TAG VERSION=$VERSION package.json=$PKG must all agree."
            exit 1
          fi
          if ! grep -q "## \[Unreleased\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no [Unreleased] section to finalize."
            exit 1
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          body: |
            See CHANGELOG.md for details of this release.

  # Maintainer: add NPM_TOKEN to repository secrets before the first publish.
  npm-publish:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22.22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Build and publish arxic
        if: ${{ env.NODE_AUTH_TOKEN != '' }}
        run: pnpm --filter arxic build && npm publish
        working-directory: apps/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
