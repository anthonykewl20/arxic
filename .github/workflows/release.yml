name: Release

on:
  push:
    tags:
      - 'v*'
  # Dispatch always runs the gates but never publishes or creates a release.
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-test:
    uses: ./.github/workflows/release-test.yml
    permissions:
      contents: read

  release:
    needs: [release-test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: |
          set -euo pipefail
          # Keep an unrelated third party's apt publish state off this gate: the
          # runner image ships Google's Chrome apt repository, `playwright
          # install --with-deps` runs `apt-get update`, and apt exits non-zero if ANY
          # configured source fails — however irrelevant. Playwright brings its
          # own browsers; these are Ubuntu libraries. Observed 2026-09-09: that
          # repository served an index disagreeing with its own Release file
          # (declared 233e56de…, served bc1428ab…), taking down every
          # browser-installing job. Reproduced independently off-CI.
          # Removes no Ubuntu source and relaxes nothing: if the libraries
          # cannot be installed, this step still fails.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
                     /etc/apt/sources.list.d/google-chrome.sources
          pnpm --filter @arxic/playwright-agent-adapter exec playwright install --with-deps chromium

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck && pnpm typecheck:packages

      - name: Test
        run: pnpm test

      - name: Verify version provenance
        run: node scripts/assert-version-provenance.mjs

      - name: Smoke test the packed CLI
        run: node scripts/tarball-smoke.mjs

      - name: Human-flow E2E (release gate)
        run: node scripts/human-flow-e2e.mjs

      - name: Verify release tag matches VERSION
        if: ${{ github.event_name == 'push' }}
        run: |
          set -euo pipefail
          expected="$(node scripts/version.mjs label)"
          if [ "$expected" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME must equal $expected"
            exit 1
          fi

      - name: Describe dry run
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          echo "Dry run complete: would publish arxic@$(cat VERSION) with npm provenance."
          echo "Dry run complete: would create the matching GitHub Release."

      - name: Publish arxic with npm provenance
        if: ${{ github.event_name == 'push' }}
        working-directory: apps/cli
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        if: ${{ github.event_name == 'push' }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
