name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9 # version comes from package.json "packageManager"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @arxic/playwright-agent-adapter exec playwright install --with-deps chromium

      - name: Verify metadata (VERSION == package.json; CHANGELOG present)
        run: |
          set -euo pipefail
          [ "$(cat VERSION)" = "$(node -p 'require("./package.json").version')" ] || { echo "::error::VERSION and package.json version disagree"; exit 1; }
          grep -q "## \[Unreleased\]" CHANGELOG.md || { echo "::error::CHANGELOG.md missing [Unreleased] section"; exit 1; }

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Format
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: License gate
        run: node scripts/license-gate.mjs

      - name: SBOM (CycloneDX)
        run: pnpm sbom --sbom-format cyclonedx --out sbom.cdx.json

      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json

      - name: Fixture apps typecheck
        run: pnpm --filter reference-auth-app typecheck && pnpm --filter vulnerable-auth-app typecheck

      - name: Start Mailpit
        run: docker run -d --name mailpit -p 1025:1025 -p 8025:8025 axllent/mailpit:latest

      - name: Fixture apps test (real Mailpit)
        run: pnpm --filter reference-auth-app test && pnpm --filter vulnerable-auth-app test
        env:
          ARXIC_MAILPIT_SMTP: localhost:1025
          ARXIC_MAILPIT_API: http://localhost:8025

      - name: Command-guard denylist test
        run: bash .opencode/plugins/test-guard.sh
