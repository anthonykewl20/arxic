version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Group only minor + patch updates (safe to batch). Major updates are NOT
    # grouped, so each opens its own PR for deliberate evaluation against the
    # contract suites (charter §6 / ADR §23.14) — never a batch merge.
    groups:
      minor-patch:
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    ignore:
      # Exactly pinned + governed by hand-transcribed upgrade-contract gates
      # (#9 ast-grep, #10 playwright). Bump deliberately and re-baseline the
      # contract suite (ADR §23.14). `ignore` suppresses scheduled version PRs
      # only; Dependabot SECURITY alerts still fire for CVEs.
      - dependency-name: '@ast-grep/cli'
      - dependency-name: '@playwright/test'
      # Block ALL major-version bumps from auto-landing. Dependabot PR #139 was
      # a grouped "minor+patch" PR that carried 20 majors (typescript 5->7,
      # eslint 9->10, otplib 12->13, vitest 3->4, ...) and broke lint+typecheck
      # when merged unvalidated during the Actions billing outage (PR #143
      # reverted it). Majors now require deliberate evaluation + green CI.
      # Security-driven major bumps (CVEs) still come through as security
      # updates.
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
    open-pull-requests-limit: 15
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-patch:
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    ignore:
      # Same rationale as npm: no auto major bumps for workflow actions
      # (action majors can break workflows; validate deliberately with CI).
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
    open-pull-requests-limit: 15
    commit-message:
      prefix: 'chore(deps)'
